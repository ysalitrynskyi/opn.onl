name: CI

on:
  pull_request:
  push:
    # A push to `main` or `release` runs CI on the commit itself.
    # docker-build.yml waits for that run to pass before it publishes images
    # for the commit (.github/scripts/wait-for-ci.sh).
    branches:
      - main
      - release
      - security-audit-fixes
  workflow_dispatch:

# Cancel in-progress runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (fmt + clippy + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opn_onl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opn_onl_test
      REDIS_URL: redis://localhost:6379
      # CI-only secret; must be >= 32 bytes to satisfy the new startup validation.
      JWT_SECRET: ci-test-jwt-secret-please-change-in-production-0123456789
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v4

      # Same version as backend/rust-toolchain.toml and the release image.
      # @stable floated ahead of the image and let a newer crate pass CI,
      # then fail the release build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        working-directory: backend
        run: cargo fmt --check

      # Warnings fail the build, matching the local gate. --all-features is
      # included so a warning that only the default features hide cannot pass.
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: backend
        run: cargo test --all-features

      # The container entrypoint downloads GeoIP before the server listens;
      # a stalled download must not keep the API down.
      - name: GeoIP download script
        working-directory: backend
        run: sh scripts/test-download-geoip.sh

      # docker-build.yml publishes nothing until CI passed on the commit; this
      # is the script that decides it.
      - name: Image publication gate script
        run: bash .github/scripts/test-wait-for-ci.sh

  frontend-test:
    name: Frontend (vitest + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        env:
          # The prerender step uses Playwright's Chromium, same as the image.
          # Skip Puppeteer's own browser downloads. Puppeteer 22+ reads
          # PUPPETEER_SKIP_DOWNLOAD; the old ..._CHROMIUM_DOWNLOAD name is ignored.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # tsc -b alone used to be the whole "build". The release image is what
      # actually prerenders, so a broken Puppeteer launch or a missing
      # dist/index.html waited until that image. npm run build is tsc, Vite,
      # prerender, and verify-prerender.
      - name: Production build
        working-directory: frontend
        run: |
          set -euo pipefail
          export PUPPETEER_EXECUTABLE_PATH="$(find "$HOME/.cache/ms-playwright" -name chrome -type f | head -1)"
          test -n "$PUPPETEER_EXECUTABLE_PATH"
          test -x "$PUPPETEER_EXECUTABLE_PATH"
          npm run build

      # Runtime env injection (GA_ID / GA_CONSENT_MODE) happens in the container
      # entrypoint, so nothing above would notice it breaking. Substituting the
      # SPA shell only once left analytics dead on every prerendered page.
      - name: Entrypoint runtime injection
        working-directory: frontend
        run: sh scripts/test-entrypoint.sh

  frontend-production-smoke:
    name: Frontend production headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production nginx configuration
        run: >-
          docker build
          --target csp-config
          --build-arg VITE_API_URL=https://api.smoke.test
          --tag opn-frontend-csp-smoke
          frontend

      # Two behaviours only show up against a running nginx with an upstream:
      #  - the image's stock http-level access log (client address, X-Forwarded-For,
      #    referrer, user agent, full request line with ?token=) must be replaced
      #    by the privacy format, and
      #  - a proxied redirect must carry the backend's own Referrer-Policy once,
      #    not that plus nginx's default.
      # A stub named `backend` stands in for the API on a user-defined network
      # (the proxy resolves it through Docker's DNS, as in the compose files).
      - name: Verify access log privacy and redirect Referrer-Policy
        run: |
          set -euo pipefail

          # Static: no access_log may use a format other than the privacy one, and
          # that format may not name anything that identifies the visitor or carries
          # the query string.
          if grep -E '^[[:space:]]*access_log[[:space:]]' frontend/nginx.conf \
              | grep -vE '^[[:space:]]*access_log[[:space:]]+(off|/var/log/nginx/access\.log[[:space:]]+privacy);'; then
            echo "access_log uses a format other than 'privacy'"
            exit 1
          fi
          grep -E "^log_format[[:space:]]+privacy[[:space:]]" frontend/nginx.conf
          if grep -E '^log_format[[:space:]]' frontend/nginx.conf \
              | grep -E '\$(remote_addr|realip_remote_addr|http_x_forwarded_for|http_x_real_ip|http_cf_connecting_ip|http_referer|http_user_agent|request|request_uri|args|query_string|is_args)\b'; then
            echo "log_format names a client-identifying or query-carrying variable"
            exit 1
          fi

          cat > "$RUNNER_TEMP/backend-stub.conf" <<'EOF'
          server {
              listen 3000;
              location = /nopolicy {
                  return 200 "ok";
              }
              location / {
                  add_header Referrer-Policy "no-referrer" always;
                  return 307 https://destination.example/landing;
              }
          }
          EOF

          network=opn-smoke-net
          docker network create "$network"
          backend_id=$(docker run --detach --name backend --network "$network" \
            --volume "$RUNNER_TEMP/backend-stub.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine)
          frontend_id=$(docker run --detach --network "$network" \
            --publish 127.0.0.1:8081:80 opn-frontend-csp-smoke)
          trap 'docker rm --force "$backend_id" "$frontend_id" >/dev/null; docker network rm "$network" >/dev/null' EXIT

          # Ready once a proxied request round-trips through the stub.
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8081/nopolicy; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8081/nopolicy

          # Referrer-Policy: the backend's value, exactly once, on a proxied redirect.
          redirect_headers=$(curl --silent --output /dev/null --dump-header - \
            'http://127.0.0.1:8081/abc123' | tr -d '\r')
          printf '%s\n' "$redirect_headers" | grep -E '^HTTP/[0-9.]+ 307'
          test "$(printf '%s\n' "$redirect_headers" | grep -ic '^referrer-policy:')" -eq 1
          printf '%s\n' "$redirect_headers" | grep -ix 'referrer-policy: no-referrer'

          # Control: a proxied response without a policy still gets nginx's default.
          plain_headers=$(curl --silent --output /dev/null --dump-header - \
            http://127.0.0.1:8081/nopolicy | tr -d '\r')
          test "$(printf '%s\n' "$plain_headers" | grep -ic '^referrer-policy:')" -eq 1
          printf '%s\n' "$plain_headers" | grep -ix 'referrer-policy: strict-origin-when-cross-origin'

          # Access log: visit the token pages and a short link as a real visitor
          # would arrive through the tunnel (client address in X-Forwarded-For,
          # referrer and user agent set), then read what nginx wrote to stdout.
          for url in \
            'http://127.0.0.1:8081/reset-password?token=SECRET123' \
            'http://127.0.0.1:8081/verify-email?token=SECRET123' \
            'http://127.0.0.1:8081/abc123?unlock=SECRET456'; do
            curl --silent --output /dev/null \
              --header 'X-Forwarded-For: 203.0.113.7' \
              --header 'Referer: https://referrer.example/from-page' \
              --user-agent 'smoke-agent/9.9' \
              "$url"
          done

          for attempt in $(seq 1 10); do
            logs=$(docker logs "$frontend_id" 2>/dev/null)
            if printf '%s\n' "$logs" | grep -qE ' GET /abc123 307 '; then
              break
            fi
            sleep 1
          done

          # The paths must be logged (otherwise the checks below prove nothing)...
          printf '%s\n' "$logs" | grep -E ' GET /reset-password [0-9]{3} '
          printf '%s\n' "$logs" | grep -E ' GET /verify-email [0-9]{3} '
          printf '%s\n' "$logs" | grep -E ' GET /abc123 307 '
          # ...without the visitor, the referrer, the user agent or any query string.
          for leaked in 203.0.113.7 SECRET123 SECRET456 referrer.example smoke-agent 'token=' 'unlock='; do
            if printf '%s\n' "$logs" | grep -F -- "$leaked"; then
              echo "access log contains '$leaked'"
              exit 1
            fi
          done

      - name: Verify served security headers
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:8080:80 opn-frontend-csp-smoke)
          trap 'docker rm --force "$container_id"' EXIT

          # csp-config ships nginx + conf only (no Vite dist). Placeholder files
          # let the cache-policy split be asserted without a full frontend build.
          docker exec "$container_id" sh -c '
            mkdir -p /usr/share/nginx/html/assets
            printf "ok\n" > /usr/share/nginx/html/assets/app-deadbeef.js
            printf "ok\n" > /usr/share/nginx/html/favicon-32x32.png
            printf "{}\n" > /usr/share/nginx/html/manifest.json
            printf "ok\n" > /usr/share/nginx/html/bg-contours.avif
            printf "ok\n" > /usr/share/nginx/html/bg-network.webp
            printf "ok\n" > /usr/share/nginx/html/robots.txt
            printf "{}\n" > /usr/share/nginx/html/sitemap.xml
          '

          # nginx drops inherited add_header when a location sets any of its
          # own, so every class that sets Cache-Control must repeat the full
          # security set. One helper so HTML /assets/ and public/ cannot drift.
          # blob: is required by the QR modal, which fetches the code with an auth
          # header and renders it through URL.createObjectURL. Dropping it blocks
          # the image and the modal renders empty.
          assert_security_headers() {
            printf '%s\n' "$1" | grep -iF "x-frame-options: SAMEORIGIN"
            printf '%s\n' "$1" | grep -iF "x-content-type-options: nosniff"
            printf '%s\n' "$1" | grep -iF "x-xss-protection: 1; mode=block"
            printf '%s\n' "$1" | grep -iF "referrer-policy: strict-origin-when-cross-origin"
            printf '%s\n' "$1" | grep -iF "strict-transport-security: max-age=63072000; includeSubDomains"
            printf '%s\n' "$1" | grep -iF "content-security-policy:"
            printf '%s\n' "$1" | grep -iF "img-src 'self' data: blob: https:;"
            printf '%s\n' "$1" | grep -iF "permissions-policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()"
          }

          for attempt in $(seq 1 20); do
            if headers=$(curl --fail --silent --show-error --head http://127.0.0.1:8080/); then
              break
            fi
            sleep 1
          done

          test -n "${headers:-}"
          assert_security_headers "$headers"
          printf '%s\n' "$headers" | grep -iF "script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com;"
          ! printf '%s\n' "$headers" | grep -iF "unsafe-eval"
          printf '%s\n' "$headers" | grep -iF "connect-src 'self' https://api.smoke.test wss://api.smoke.test https://www.google-analytics.com https://region1.google-analytics.com https://www.google.com https://cloudflareinsights.com;"
          # HTML must be revalidated on every load. Without this a browser keeps
          # the previous deploy's SPA shell — stale hashed asset names and stale
          # entrypoint-injected runtime config (GA_ID / GA_CONSENT_MODE).
          printf '%s\n' "$headers" | grep -iE "^cache-control: *no-cache"

          # Hashed Vite output under /assets/ is content-addressed and may be
          # cached forever. The location repeats security headers because nginx
          # drops inherited add_header when the inner scope sets Cache-Control.
          asset_headers=$(curl --fail --silent --show-error --head http://127.0.0.1:8080/assets/app-deadbeef.js)
          printf '%s\n' "$asset_headers" | grep -iE "^cache-control:.*\bpublic\b.*\bimmutable\b"
          assert_security_headers "$asset_headers"

          # Unhashed files from public/ keep stable URLs across deploys, so they
          # must not be immutable. A new logo / favicon / manifest.json / hero
          # background / sitemap would otherwise stay stale in returning
          # browsers (and any CDN honoring immutable) for up to a year.
          for public_path in /favicon-32x32.png /manifest.json /bg-contours.avif /bg-network.webp /robots.txt /sitemap.xml; do
            public_headers=$(curl --fail --silent --show-error --head "http://127.0.0.1:8080${public_path}")
            printf '%s\n' "$public_headers" | grep -iE "^cache-control: *no-cache"
            ! printf '%s\n' "$public_headers" | grep -iE "cache-control:.*\bimmutable\b"
            assert_security_headers "$public_headers"
          done

          ! printf '%s\n' "$headers" | grep -Fq '__API_CONNECT_SRC__'
          ! docker exec "$container_id" grep -Rq '__API_CONNECT_SRC__' /etc/nginx/conf.d
          ! grep -R "fonts.googleapis.com" frontend/src

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opn_onl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opn_onl_test
      # CI-only secret; must be >= 32 bytes to satisfy the new startup validation.
      JWT_SECRET: ci-test-jwt-secret-please-change-in-production-0123456789
      RUST_LOG: warn
      FRONTEND_URL: http://localhost:5173
      BASE_URL: http://localhost:3000
      HOST: 0.0.0.0
      # e2e/support/api.ts gives each fixture request its own CF-Connecting-IP
      # so account setup never spends the auth rate-limit bucket under test.
      TRUST_PROXY_HEADERS: 'true'
    steps:
      - uses: actions/checkout@v4

      # Same version as backend/rust-toolchain.toml and the release image.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend
        working-directory: backend
        run: cargo build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        env:
          # Playwright drives its own Chromium here; Puppeteer's is never used.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        # PORT is scoped to this step: Vite also honours PORT, and a job-wide
        # PORT=3000 sent the dev server to 3001 while Playwright waited on 5173.
        env:
          PORT: '3000'
        run: |
          nohup ./target/debug/opn_onl_backend > /tmp/opn-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"
          cat /tmp/opn-backend.log
          exit 1

      - name: Run Playwright gate
        working-directory: frontend
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-gate
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # The release workflow is the only place that used to compile
  # backend/Dockerfile, and it runs on `release`, not on pull requests. A
  # musl or cargo-chef failure therefore landed after merge. This job builds
  # linux/amd64 and does not push. linux/arm64 stays on the release workflow.
  backend-image:
    name: Backend image (linux/amd64, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to build the backend image
        id: filter
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$event" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(backend/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "backend image: build"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "backend image: skip (no changes under backend/ or .github/workflows/)"
          fi

      - name: Set up Docker Buildx
        if: steps.filter.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build
        if: steps.filter.outputs.run == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          tags: opn-backend:ci
          cache-from: type=gha,scope=ci-backend-amd64
          cache-to: type=gha,mode=max,scope=ci-backend-amd64
