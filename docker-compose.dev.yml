version: '3.8'

# Development docker-compose file
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # ===========================================
  # DATABASE - PostgreSQL
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: opn_onl_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opn_onl
    # Loopback-only: the image uses POSTGRES_PASSWORD=postgres, which is fine
    # on the compose network and for a local `psql`, but must not be reachable
    # off-host on a VPS or untrusted LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opn-network

  # ===========================================
  # CACHE - Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: opn_onl_redis
    restart: unless-stopped
    # Loopback-only: this instance has no requirepass (the backend container
    # talks to it on the compose network). Publishing 0.0.0.0:6379 would let
    # anyone on the LAN read or poison the cache.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opn-network

volumes:
  db_data:
  redis_data:

networks:
  opn-network:
    driver: bridge





