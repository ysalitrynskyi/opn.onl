version: '3.8'

# ===========================================
# PORTAINER DEPLOYMENT - ARM64 (aarch64)
# ===========================================
# For ARM-based servers (Raspberry Pi, AWS Graviton, etc.)
# 
# Images are automatically built by GitHub Actions.
# Just set BACKEND_IMAGE and FRONTEND_IMAGE in your .env:
#   BACKEND_IMAGE=ghcr.io/ysalitrynskyi/opn-backend:latest
#   FRONTEND_IMAGE=ghcr.io/ysalitrynskyi/opn-frontend:latest

# Docker keeps every line a container prints, forever, unless told otherwise.
# Rotate the json-file logs so they cannot fill the disk the database lives on.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:15-alpine
    container_name: opn_onl_db
    # Loopback-only publish so an SSH tunnel has a stable target
    # (container IPs are Docker-assigned and move between redeploys).
    # NOT reachable off-host: bound to 127.0.0.1, never 0.0.0.0.
    # Host port is configurable: 5432 is often already occupied on a host that
    # runs more than one postgres. Override with POSTGRES_HOST_PORT.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-opn_onl}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opn-network

  redis:
    image: redis:7-alpine
    container_name: opn_onl_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opn-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ysalitrynskyi/opn-backend:latest}
    platform: linux/arm64
    container_name: opn_onl_backend
    restart: unless-stopped
    # On stop the backend drains connections, writes buffered clicks, then waits
    # for mail it already promised; Docker's default 10 s can cut that short.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Discrete Postgres pieces. The backend percent-encodes userinfo when
      # assembling DATABASE_URL, so a password containing `@`, `:`, or `/`
      # still parses. Do not interpolate POSTGRES_PASSWORD into a URL here.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-opn_onl}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      HOST: 0.0.0.0
      PORT: 3000
      BASE_URL: ${BASE_URL:-https://opn.onl}
      FRONTEND_URL: ${FRONTEND_URL:-https://opn.onl}
      # WebAuthn RP ID. Empty: derived from FRONTEND_URL. Set to override.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      # Not behind Cloudflare? Set REAL_IP_HEADER=none. An empty value does not
      # disable it: compose substitutes the Cloudflare default for empty.
      REAL_IP_HEADER: ${REAL_IP_HEADER:-cf-connecting-ip}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Open /ws and /sse connections one account may hold at once (0 = no limit).
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-5}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
      LOG_DIR: /app/logs
      # Daily log files kept in the logs volume (0 keeps them all).
      LOG_MAX_FILES: ${LOG_MAX_FILES:-14}
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@opn.onl}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-opn.onl}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      EMAIL_RATE_LIMIT_PER_HOUR: ${EMAIL_RATE_LIMIT_PER_HOUR:-500}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Set to false only if your instance has no SMTP; anyone can then sign up
      # with an address they do not own. Default true. Missing SMTP does not turn this off.
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      # Once a day, mail owners whose personal links expire within 3 days
      # (users can turn it off in Settings). Default true; needs SMTP.
      LINK_EXPIRY_REMINDERS: ${LINK_EXPIRY_REMINDERS:-true}
      # POST /links without credentials. Default false: the API needs an account.
      ALLOW_ANONYMOUS_LINKS: ${ALLOW_ANONYMOUS_LINKS:-false}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      CLICK_BUFFER_SIZE: ${CLICK_BUFFER_SIZE:-100}
      CLICK_FLUSH_INTERVAL: ${CLICK_FLUSH_INTERVAL:-10}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      # Link management settings
      ENABLE_CUSTOM_ALIASES: ${ENABLE_CUSTOM_ALIASES:-true}
      MIN_ALIAS_LENGTH: ${MIN_ALIAS_LENGTH:-5}
      MAX_ALIAS_LENGTH: ${MAX_ALIAS_LENGTH:-25}
      # Per-user link cap. Empty or 0 means unlimited (the default).
      MAX_LINKS_PER_USER: ${MAX_LINKS_PER_USER:-}
      ENABLE_URL_SANITIZATION: ${ENABLE_URL_SANITIZATION:-true}
      # Abuse guards on link destinations (both default on).
      BLOCK_DANGEROUS_FILE_EXTENSIONS: ${BLOCK_DANGEROUS_FILE_EXTENSIONS:-true}
      BLOCK_RAW_IP_URLS: ${BLOCK_RAW_IP_URLS:-true}
      # Branded QR codes (brand colour / centre logo / SVG). Kill-switch, default on.
      ENABLE_QR_BRANDING: ${ENABLE_QR_BRANDING:-true}
      # Burn-after-reading (one-time / self-destruct links). Opt-in, default off.
      ENABLE_BURN_AFTER_READING: ${ENABLE_BURN_AFTER_READING:-true}
      # Safe-link interstitial (destination preview + reputation). Opt-in, default off.
      ENABLE_SAFE_LINK_INTERSTITIAL: ${ENABLE_SAFE_LINK_INTERSTITIAL:-true}
      # Smart conditional routing (device/OS/country/language + A/B). Opt-in, default off.
      ENABLE_CONDITIONAL_ROUTING: ${ENABLE_CONDITIONAL_ROUTING:-true}
      # Link-in-bio (opt-in public profile at /@username). Default off.
      ENABLE_LINK_IN_BIO: ${ENABLE_LINK_IN_BIO:-true}
      # API keys (personal access tokens for the MCP server / API clients). Default on.
      ENABLE_API_KEYS: ${ENABLE_API_KEYS:-true}
      # Passkeys (WebAuthn enroll/login). Kill-switch, default on.
      ENABLE_PASSKEYS: ${ENABLE_PASSKEYS:-true}
      # Account settings
      ENABLE_ACCOUNT_DELETION: ${ENABLE_ACCOUNT_DELETION:-false}
      # Days before per-visitor click identifiers are anonymized (0 disables)
      ANALYTICS_PII_RETENTION_DAYS: ${ANALYTICS_PII_RETENTION_DAYS:-396}
      # Days a deleted account is kept (restorable) before it is removed for good (0 disables)
      ACCOUNT_PURGE_DAYS: ${ACCOUNT_PURGE_DAYS:-30}
    volumes:
      - backend_logs:/app/logs
      - backend_geoip:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks:
      - opn-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ysalitrynskyi/opn-frontend:latest}
    platform: linux/arm64
    container_name: opn_onl_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Google Analytics (optional) - set to your GA4 tracking ID
      GA_ID: ${GA_ID:-}
      # Consent banner direction: opt-in (default, GA waits for Accept) or
      # opt-out (GA runs from page load and stops on Decline)
      GA_CONSENT_MODE: ${GA_CONSENT_MODE:-opt-in}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    networks:
      - opn-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: opn_onl_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
      - frontend
    networks:
      - opn-network

  # Optional: Database admin UI. Off unless you enable the `pgadmin` profile
  # (`docker compose --profile pgadmin up`, or enable the profile in Portainer).
  # Interpolation of ${PGADMIN_PASSWORD:?} is evaluated for every service when
  # Compose parses the file, so a required-password check here aborted the
  # whole stack even when pgAdmin was not wanted.
  # SECURITY: this is a full Postgres admin console. If exposed (e.g. tunneled to
  # db.opn.onl) it must require login — SERVER_MODE=True forces the login screen,
  # MASTER_PASSWORD_REQUIRED=True protects saved server credentials. Prefer gating
  # it behind Cloudflare Access as well, and only enable this service when needed.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: opn_onl_pgadmin
    profiles: ["pgadmin"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@opn.onl}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - opn-network
    # Uncomment to expose locally (not recommended for production)
    # ports:
    #   - "5050:80"

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_geoip:
    driver: local
  pgadmin_data:
    driver: local

networks:
  opn-network:
    driver: bridge

