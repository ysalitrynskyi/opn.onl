<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Runtime config - injected by docker-entrypoint.sh -->
    <script>
      window.GA_ID = "%%GA_ID%%";
      window.GA_CONSENT_MODE = "%%GA_CONSENT_MODE%%";
    </script>

    <!-- Google Analytics consent gate. GA never loads without a GA_ID; how the
         consent banner gates it is chosen by the GA_CONSENT_MODE env var:

           opt-in (default) - GA loads only after an explicit Accept. Do-Not-Track
                              and Global Privacy Control keep it off entirely.
           opt-out          - GA loads on first paint and keeps running until an
                              explicit Decline. Global Privacy Control still keeps
                              it off up front (it is a legally recognized opt-out
                              signal); Do-Not-Track does not, since it is
                              deprecated and no longer an intentional choice.

         loadAnalytics is called from here on load and by the ConsentBanner on
         Accept; disableAnalytics is what the banner's Decline calls in opt-out
         mode to stop a tag that is already running. -->
    <script>
      window.loadAnalytics = function() {
        var gaId = window.GA_ID || '';
        if (!gaId.startsWith('G-') || window.__gaLoaded) return;
        window.__gaLoaded = true;
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        // Consent Mode v2 defaults. This deployment only ever measures traffic,
        // so the ad_* signals stay denied no matter what the visitor chooses.
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'granted',
          functionality_storage: 'granted',
          security_storage: 'granted'
        });
        gtag('js', new Date());
        // page_path does not override the document location GA sends. Build the
        // hit ourselves so a reset or verify token in the query or hash, or in
        // the referrer, never leaves the browser.
        /* analytics-hit:start */
        function analyticsHit() {
          var hit = {
            page_path: window.location.pathname,
            page_location: window.location.origin + window.location.pathname,
            anonymize_ip: true
          };
          var ref = document.referrer;
          if (ref) {
            try {
              var u = new URL(ref);
              hit.page_referrer = u.origin + u.pathname;
            } catch (e) { /* ignore unparsable referrer */ }
          }
          return hit;
        }
        /* analytics-hit:end */
        gtag('config', gaId, analyticsHit());
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
        document.head.appendChild(script);
      };
      window.disableAnalytics = function() {
        var gaId = window.GA_ID || '';
        if (!gaId.startsWith('G-')) return;
        // gtag checks this flag before every hit, so it also stops the tag that
        // opt-out mode already loaded.
        window['ga-disable-' + gaId] = true;
        if (typeof window.gtag === 'function') {
          window.gtag('consent', 'update', {
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied',
            analytics_storage: 'denied'
          });
        }
        // Drop the cookies GA already wrote, on the exact host and on the
        // registrable domain it may have scoped them to.
        try {
          var host = window.location.hostname;
          var domains = ['', host, '.' + host.split('.').slice(-2).join('.')];
          document.cookie.split(';').forEach(function(pair) {
            var name = pair.split('=')[0].trim();
            if (name !== '_ga' && name !== '_gid' && name.indexOf('_ga_') !== 0) return;
            domains.forEach(function(domain) {
              document.cookie = name + '=; path=/; max-age=0' + (domain ? '; domain=' + domain : '');
            });
          });
        } catch (e) { /* cookie access blocked: the disable flag still holds */ }
      };
      (function() {
        var gpc = navigator.globalPrivacyControl === true;
        var dnt = navigator.doNotTrack === '1' || window.doNotTrack === '1'
          || navigator.msDoNotTrack === '1';
        var stored = null;
        try {
          stored = localStorage.getItem('analytics_consent');
        } catch (e) { /* localStorage unavailable: fall through with no choice */ }
        if (window.GA_CONSENT_MODE === 'opt-out') {
          if (!gpc && stored !== 'denied') window.loadAnalytics();
        } else if (!gpc && !dnt && stored === 'granted') {
          window.loadAnalytics();
        }
      })();
    </script>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />

    <meta name="theme-color" content="#2f37d8" />

    <!-- The title, description, robots, canonical, Open Graph and Twitter tags
         come from src/components/SEO.tsx, per page. Do not add static copies
         here: every prerendered page is this file plus the tags SEO renders,
         so a static tag becomes a second, contradicting one (and on app
         routes, which are served the prerendered home page, a home-page tag). -->

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
