# Preserve original X-Forwarded-Proto from upstream (Cloudflare)
# If not set, default to $scheme
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HTML must always be revalidated. The SPA shell and every prerendered page carry
# both the hashed asset names and the runtime config the entrypoint injects
# (GA_ID / GA_CONSENT_MODE), so a browser holding a cached copy stays pinned to
# the previous deploy — it kept showing the old consent banner after the 1.3.0
# rollout. Nothing here sent a Cache-Control for HTML, and with no explicit
# header browsers fall back to heuristic freshness derived from Last-Modified.
# Hashed assets are content-addressed and keep their one-year immutable cache.
# An empty value means nginx adds no header at all, so this only touches HTML.
map $sent_http_content_type $html_cache_control {
    default       "";
    "~*text/html" "no-cache";
}

# Referrer-Policy: nginx's own default is added only when the upstream did not
# send one. The backend marks every redirect to a destination `no-referrer`;
# adding nginx's value on top gave the browser two Referrer-Policy fields, the
# last recognised one wins, and the destination received an origin-only Referer
# instead of none. An empty value means no header at all (as with the map above),
# so a proxied redirect keeps exactly the backend's header and everything else
# keeps the default.
map $upstream_http_referrer_policy $default_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

# Access log. This file replaces only conf.d/default.conf, so the stock
# http-level `access_log ... main` from the image's nginx.conf would otherwise
# keep running next to it: that format writes the client address, the trailing
# X-Forwarded-For (the real visitor behind Cloudflare), referrer, user agent and
# the full request line — including the ?token= of password-reset and
# email-verification links — to container stdout, where nothing rotates it.
# Click analytics truncate and expire this same data, so the web server must not
# keep a fuller copy. The `access_log` directive in the server block below
# replaces the http-level one (access_log is inherited only when the current
# level defines none), so `main` never runs.
#
# $log_path is the request path with the query string cut off. $request_uri would
# keep the query and $uri is rewritten by try_files (every SPA page would log as
# /index.html).
map $request_uri $log_path {
    "~^(?<path_only>[^?]*)" $path_only;
    default                 "-";
}

log_format privacy '$time_iso8601 $request_method $log_path $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Same path the image's stock config logs to (a symlink to stdout). Locations
    # below that set `access_log off` still win over this.
    access_log /var/log/nginx/access.log privacy;

    # Resolver for dynamic proxy_pass (required for Docker internal DNS)
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    # Backend API URL
    set $backend_url "http://backend:3000";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers.
    #
    # NOTE ON INHERITANCE: nginx only inherits `add_header` from an outer scope
    # when the inner scope defines NO add_header of its own. Any `location` that
    # adds its own header (e.g. Cache-Control below) therefore drops ALL of these
    # unless it repeats them — which is why the hashed-asset and unhashed-public
    # blocks re-declare the full set. Keep the three lists in sync.
    #
    # CSP keeps 'unsafe-inline' because the SPA shell and prerendered pages
    # rely on inline scripts (runtime config, the analytics loader) and styles.
    # 'unsafe-eval' is gone: nothing in the bundle, gtag.js or Cloudflare's
    # beacon evaluates strings (decimal.js's Function("return this") fallback in
    # the charts chunk never runs in a browser). The real hardening here is
    # connect-src, restricted to 'self' plus the API origin. The frontend fetches
    # the backend cross-origin (VITE_API_URL, e.g. https://l.opn.onl), so that
    # origin MUST be allowed here or every API call is blocked and the app can
    # load no data. The placeholder below is replaced at image-build time with
    # VITE_API_URL and its wss:// form (see frontend/Dockerfile), derived from the
    # same build arg the JS bundle uses so the two can never drift. Google
    # Analytics is loaded only after explicit consent; Cloudflare Browser Insights
    # is injected at the edge. Fonts are self-hosted. Keep analytics sources
    # explicit so connect-src still blocks exfiltration to every other host.
    #
    # img-src needs `blob:`: the QR modal fetches the code through authFetch (the
    # endpoint requires an Authorization header, so a plain <img src> cannot work)
    # and renders the response via URL.createObjectURL. Without it the browser
    # blocks the image and the modal shows an empty frame. `blob:` only ever
    # refers to data this origin already holds, so it grants no new reach.
    #
    # Referrer-Policy here is a variable (see $default_referrer_policy): it is
    # the same strict-origin-when-cross-origin default, except that a proxied
    # response carrying the backend's own policy is left alone. The two blocks
    # below only serve local files, so their literal copy is that same default.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy $default_referrer_policy always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' __API_CONNECT_SRC__ https://www.google-analytics.com https://region1.google-analytics.com https://www.google.com https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $html_cache_control always;

    # Health check endpoint (exact match, highest priority)
    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Hashed Vite output under /assets/. Filenames are content-addressed, so
    # they can be cached forever. ^~ skips later regex locations. This block
    # defines its own add_header, so it must repeat the security headers above
    # (nginx add_header inheritance rule).
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' __API_CONNECT_SRC__ https://www.google-analytics.com https://region1.google-analytics.com https://www.google.com https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed files from public/ (logo, favicons, manifest, OG image, …).
    # These keep stable URLs across deploys, so they must revalidate — a
    # one-year immutable cache left returning browsers on the previous logo
    # and PWA manifest after HTML (no-cache) had already picked up the rest
    # of the release. Repeats security headers (nginx add_header inheritance).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|webmanifest|avif|webp|txt|xml)$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' __API_CONNECT_SRC__ https://www.google-analytics.com https://region1.google-analytics.com https://www.google.com https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        access_log off;
        try_files $uri =404;
    }

    # A prerendered page has one URL: the one without a trailing slash, which is
    # its canonical and its sitemap entry. try_files used to find the page's
    # directory for /pricing/ and serve the same page again with a 200. Must
    # come before the SPA-route block below, which also matches these paths.
    # The Location is relative because nginx sees plain http behind the tunnel.
    location ~ ^/(features|pricing|developers|about|privacy|terms|contact|faq|docs|login|register)/$ {
        absolute_redirect off;
        return 301 /$1$is_args$args;
    }

    # Explicitly handle SPA routes (prevents short-link regex from matching)
    # These are known frontend routes that should serve their prerendered HTML.
    # Serve the route's own prerendered file (e.g. /features/index.html) for
    # correct per-page SEO (title/canonical/JSON-LD); fall back to the SPA shell
    # for app routes that aren't prerendered (dashboard, settings, organizations, admin, …).
    # `404` is the SPA's not-found route; it is short enough to look like a code.
    location ~ ^/(dashboard|overview|login|register|settings|organizations|analytics|features|pricing|developers|about|privacy|terms|contact|faq|docs|admin|verify-email|forgot-password|reset-password|404)(/.*)?$ {
        try_files $uri $uri/index.html /index.html;
    }

    # Short codes in the four locations below: generated codes are 6 characters
    # and custom aliases run from MIN_ALIAS_LENGTH to MAX_ALIAS_LENGTH (backend
    # env, defaults 5 and 50, no floor or ceiling enforced). A path this file
    # does not treat as a code is served the SPA shell instead of the redirect,
    # so crawlers, link unfurlers and curl would get HTML for a working link.
    # The range is therefore everything the backend can store — the links.code
    # column is varchar(255) — not just today's defaults. Keep all four in sync,
    # and keep each pattern quoted: nginx reads an unquoted `{` as the start of
    # a block and refuses to start.

    # Password page for protected links (SPA page)
    location ~ "^/password/([A-Za-z0-9_-]{1,255})$" {
        try_files /index.html =404;
    }

    # Password verification API - proxy to backend
    location ~ "^/([A-Za-z0-9_-]{1,255})/verify$" {
        proxy_pass $backend_url;
        # The backend sends its own copies; nginx's server-level set wins.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Link preview - proxy to backend
    location ~ "^/([A-Za-z0-9_-]{1,255})/preview$" {
        proxy_pass $backend_url;
        # The backend sends its own copies; nginx's server-level set wins.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Public bio pages (/@username). '@' is outside the short-code class below,
    # so `location /` would already serve the SPA. Keep this explicit so a later
    # regex cannot send the profile to the backend as a missing short link.
    location ~ "^/@[A-Za-z0-9_-]{1,64}/?$" {
        try_files /index.html =404;
    }

    # Short link redirects - proxy to backend for fast, bot-followable 302s.
    # The backend itself diverts safe-link-interstitial links to the SPA route
    # /r/<code> (handled by `location /`), so normal links never load the app.
    # This MUST come after the more specific rules above
    location ~ "^/([A-Za-z0-9_-]{1,255})$" {
        proxy_pass $backend_url;
        # The backend sends its own copies; nginx's server-level set wins.
        # Referrer-Policy is deliberately not hidden: the redirect's own
        # `no-referrer` must reach the browser (see $default_referrer_policy).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        # Don't pass errors to client immediately
        proxy_intercept_errors off;

        # A password-protected link continues at /<code>?unlock=<token>, and the
        # token opens the link for two minutes. nginx writes upstream failures
        # (backend down during a deploy, a timeout) at `error` level with the
        # whole request line, query included, so for this location only those
        # lines are dropped. `crit` and worse still reach the log; the backend
        # logs its own failures, and the access log already omits the query.
        error_log /var/log/nginx/error.log crit;
    }

    # Handle SPA routing - all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
